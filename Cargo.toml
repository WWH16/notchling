[package]
name = "ai-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
