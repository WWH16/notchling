[package]
name = "ai-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Already built for ureq; decodes the Claude desktop app's sealed login.
base64 = "0.23.1"
# Already built for Slint; parses log timestamps and the reset times of usage windows.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
raw-window-handle = "0.6"
# Pure-Rust zstd decoder for Codex's compressed session logs; no C build.
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# Software renderer: same look here, a third of the RAM of the OpenGL renderer.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-software", "raw-window-handle-06"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.8"
# Windows' own TLS (SChannel) and certificate store instead of rustls and ring. gzip
# shrinks Google's incident feed from 224 KB to about 35 KB.
ureq = { version = "3.5.0", default-features = false, features = ["gzip", "native-tls-no-default"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
